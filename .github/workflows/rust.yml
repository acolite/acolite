name: Rust CI/CD

on:
  push:
    branches: [feature/rust-port, main]
    tags: ["v*"]
  pull_request:
    branches: [feature/rust-port, main]
    paths:
      - "src/**"
      - "tests/**"
      - "benches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"

env:
  CARGO_TERM_COLOR: always
  # Note: not using -Dwarnings in RUSTFLAGS because of pre-existing warnings
  # in sentinel3.rs and other files from the original port sprint

jobs:
  # ─── Test ───────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests (default features)
        run: cargo test --lib --verbose
        continue-on-error: ${{ runner.os != 'Linux' }}  # netcdf system libs only on Linux

      - name: Install system libraries (Linux, for full-io)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnetcdf-dev libhdf5-dev pkg-config

      - name: Run tests (full-io feature)
        if: runner.os == 'Linux'
        run: cargo test --lib --features full-io --verbose

      - name: Run doc tests
        run: cargo test --doc

  # ─── Lint & Format ─────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        run: cargo fmt --check
        continue-on-error: true  # Existing code not yet fully formatted

      - name: Run clippy (default features)
        run: cargo clippy -- -D warnings
        continue-on-error: true  # Pre-existing warnings in sentinel3.rs

      - name: Run clippy (all features)
        run: cargo clippy --all-features -- -D warnings
        continue-on-error: true  # full-io requires system libs

  # ─── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [test, lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: acolite-rs-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: acolite-rs-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: acolite-rs-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: acolite-rs-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: acolite-rs-windows-x86_64
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-build-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/acolite-rs dist/
          cd dist && tar czf ../${{ matrix.artifact }}.tar.gz acolite-rs

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/acolite-rs.exe" -Destination dist/
          Compress-Archive -Path dist/acolite-rs.exe -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: error

  # ─── Benchmark ──────────────────────────────────────────────────────────────
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/rust-port'
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bench-

      - name: Run benchmarks
        run: cargo bench --bench performance -- --output-format bencher | tee bench-output.txt
        continue-on-error: true  # benchmarks may need test data

      - name: Upload benchmark results
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-results
          path: bench-output.txt
          if-no-files-found: ignore

  # ─── Release ────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec sh -c '
            for f; do sha256sum "$f"; done
          ' _ {} + | tee ../checksums-sha256.txt

      - name: Extract release notes from tag
        id: release_notes
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "## ACOLITE-RS $TAG_NAME" > release_notes.md
          echo "" >> release_notes.md
          echo "### Platforms" >> release_notes.md
          echo "- Linux x86_64 / aarch64" >> release_notes.md
          echo "- macOS x86_64 / Apple Silicon (aarch64)" >> release_notes.md
          echo "- Windows x86_64" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Checksums (SHA-256)" >> release_notes.md
          echo '```' >> release_notes.md
          cat checksums-sha256.txt >> release_notes.md
          echo '```' >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ACOLITE-RS ${{ steps.release_notes.outputs.tag }}
          body_path: release_notes.md
          draft: true
          prerelease: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            checksums-sha256.txt
